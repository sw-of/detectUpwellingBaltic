name: 🧪 Run Upwelling Simulation Test

on:
  workflow_dispatch:
    inputs:
      test_location:
        description: 'Wähle den Ort für die Upwelling-Simulation'
        required: true
        default: 'Kiel'
        type: choice
        options:
        - Flensburg
        - Maasholm
        - Eckernförde
        - Kiel
        - Heiligenhafen
        - Travemünde
        - Wismar
        - Kühlungsborn
        - Warnemünde
        - Graal-Müritz
        - Zingst
        - Dranske
        - Sassnitz
        - Greifswald
        - Heringsdorf

jobs:
  run-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    # Der ausgewählte Ort wird hier mit "--location" an Python übergeben
    - name: Execute Simulation
      run: python run_simulation.py --location "${{ github.event.inputs.test_location }}"
