name: Automated Upwelling Predictor

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-predict:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4.2.2

    - name: Set up Python
      uses: actions/setup-python@v5.3.0
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Upwelling Predictor
      run: python upwelling_predictor.py

    - name: Commit and Push Archive Data
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        
        # EXKLUSIVE ERLAUBNIS: Nur der Ordner archive/ und die eine Übersichtsdatei werden hinzugefügt
        git add archive/ upwellingWarning.csv
        
        if ! git diff --cached --quiet; then
          git commit -m "Datenarchiv und upwellingWarning.csv aktualisiert: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
        else
          echo "Keine relevanten Datenänderungen zu sichern."
        fi
