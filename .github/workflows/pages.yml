name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
    # 🎯 Der Workflow startet NUR, wenn sich in diesen Pfaden etwas ändert:
    paths:
      - 'index.html'   # Deine Haupt-HTML-Datei im Root-Verzeichnis

  # Erlaubt es dir, die Seite im Actions-Tab bei Bedarf manuell zu starten
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Falls die gebaute Website im Root oder einem Unterordner liegt (z.B. './dist')
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
